plugins {

    id "com.android.application"

    id "org.jetbrains.kotlin.android"

    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()

def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')

if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}


def flutterVersionName = localProperties.getProperty('flutter.versionName')

if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}


android {

    namespace "com.example.multi_watch_app"

    compileSdk 37


    ndkVersion "28.2.13676358"


    compileOptions {

        sourceCompatibility JavaVersion.VERSION_21

        targetCompatibility JavaVersion.VERSION_21
    }


    kotlinOptions {

        jvmTarget = "21"
    }


    defaultConfig {

        applicationId "com.example.multi_watch_app"


        minSdk 24

        targetSdk 37


        versionCode flutterVersionCode.toInteger()

        versionName flutterVersionName


        multiDexEnabled true


        ndk {

            abiFilters "armeabi-v7a",
                    "arm64-v8a",
                    "x86",
                    "x86_64"
        }
    }


    signingConfigs {

        release {

            keyAlias "zhongxin"

            keyPassword "veepooandroid"

            storeFile file("F:\\ExportProject\\zhongxin003.keystore")

            storePassword "veepooandroid"
        }
    }


    buildTypes {

        release {

            signingConfig signingConfigs.release


            minifyEnabled true

            shrinkResources true


            proguardFiles(
                    getDefaultProguardFile(
                            "proguard-android-optimize.txt"
                    ),

                    "proguard-rules.pro"
            )
        }
    }


    repositories {

        flatDir {

            dirs "libs"
        }
    }
}


flutter {

    source "../.."
}


dependencies {


    implementation fileTree(
            include: ["*.jar", "*.aar"],
            dir: "libs"
    )


    implementation files(
            "libs/gson-2.2.4.jar"
    )


    implementation files(
            "libs/vpbluetooth-1.18.aar"
    )


    implementation files(
            "libs/vpprotocol-2.3.31.15.aar"
    )


    implementation files(
            "libs/JL_Watch_V1.13.1_11214-release.aar"
    )


    implementation files(
            "libs/jl_rcsp_V0.7.2_527-release.aar"
    )


    implementation files(
            "libs/jl_bt_ota_V1.10.0_10931-release.aar"
    )


    implementation files(
            "libs/BmpConvert_V1.6.0_10604-release.aar"
    )


    implementation "androidx.appcompat:appcompat:1.8.0"

    implementation "androidx.recyclerview:recyclerview:1.4.0"

    implementation "androidx.constraintlayout:constraintlayout:2.2.0"

    implementation "androidx.multidex:multidex:2.0.1"

    implementation "androidx.work:work-runtime:2.9.0"


    implementation 'com.orhanobut:logger:1.15'

    implementation 'no.nordicsemi.android.support.v18:scanner:1.4.2'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
    implementation 'com.yanzhenjie.recyclerview:support:1.3.2'
    implementation 'tech.gujin:toast-util:1.2.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'org.json:json:20230227'

    testImplementation 'junit:junit:4.12'
}

